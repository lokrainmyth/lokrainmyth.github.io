<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lo.Krain — Io</title>

    <meta
        name="description"
        content="Io — the album by Lo.Krain.">

    <meta
        name="theme-color"
        content="#0e0d0c">

    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Modak&display=swap"
        rel="stylesheet">

    <!-- =====================================================
         ICONS
    ====================================================== -->

    <link
        rel="icon"
        href="assets/icons/favicon.ico">

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/icons/favicon-32x32.png">

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="assets/icons/favicon-16x16.png">

    <link
        rel="apple-touch-icon"
        href="assets/icons/apple-touch-icon.png">

    <link
        rel="manifest"
        href="assets/icons/site.webmanifest">

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
        property="og:title"
        content="Lo.Krain — Io">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:image"
        content="assets/icons/social-cover.jpg">

    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/theme.css">

    <link
        rel="stylesheet"
        href="css/animations.css">

    <link
        rel="stylesheet"
        href="css/main.css">

    <link
        rel="stylesheet"
        href="css/responsive.css">

</head>


<body>


<!-- =========================================================
     INTRO
========================================================= -->

<div
    class="intro"
    id="intro"
    aria-label="Lo.Krain — Io">

    <div class="intro-content">

        <h1
            class="intro-logo"
            id="introLogo">

            Lo.Krain — Io

        </h1>


       <p class="intro-action">
    Journey to the Dawn
</p>

<div class="intro-sun-symbol" aria-hidden="true">
    ☀
</div>

        <!-- =================================================
             SUN
        ================================================== -->

        <div
            class="intro-sun"
            id="introSun"
            aria-hidden="true">

            <svg
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg">

                <!-- central sun -->

                <circle
                    cx="50"
                    cy="50"
                    r="7"
                    class="sun-core">
                </circle>


                <!-- eight rays -->

                <g class="sun-rays">

                    <line
                        x1="50"
                        y1="8"
                        x2="50"
                        y2="24">
                    </line>

                    <line
                        x1="50"
                        y1="76"
                        x2="50"
                        y2="92">
                    </line>

                    <line
                        x1="8"
                        y1="50"
                        x2="24"
                        y2="50">
                    </line>

                    <line
                        x1="76"
                        y1="50"
                        x2="92"
                        y2="50">
                    </line>

                    <line
                        x1="20"
                        y1="20"
                        x2="31"
                        y2="31">
                    </line>

                    <line
                        x1="69"
                        y1="69"
                        x2="80"
                        y2="80">
                    </line>

                    <line
                        x1="80"
                        y1="20"
                        x2="69"
                        y2="31">
                    </line>

                    <line
                        x1="31"
                        y1="69"
                        x2="20"
                        y2="80">
                    </line>

                </g>

            </svg>

        </div>

    </div>

</div>



<!-- =========================================================
     OUTRO / FUTURE THRESHOLD
     
     Kept as a separate scene.
     Later this becomes the transition into Myth.
========================================================= -->

<div
    class="outro hidden"
    id="outro">

    <div class="outro-content">

        <button
            id="outroGoDeeper"
            class="outro-button">

            Go Deeper?

        </button>

    </div>

</div>



<!-- =========================================================
     WORLD
========================================================= -->

<div
    class="world"
    id="world">


    <!-- =====================================================
         ATMOSPHERE
    ====================================================== -->

    <div
        class="background-layer"
        aria-hidden="true">
    </div>


    <div
        class="grain-layer"
        aria-hidden="true">
    </div>


    <div
        class="light-layer"
        aria-hidden="true">
    </div>


    <!-- =====================================================
         GHOST WORDS

         These are intentionally hidden/abstract.
         CSS will make them atmospheric rather than readable.
    ====================================================== -->

    <div
        class="ghost-words"
        aria-hidden="true">

        <span>PATH</span>

        <span>NIGHT</span>

        <span>IO</span>

        <span>DAWN</span>

        <span>HOME</span>

    </div>



    <!-- =====================================================
         MAIN EDITION
    ====================================================== -->

    <main class="edition">


        <!-- =================================================
             LEFT COLUMN — COVER
        ================================================== -->

        <section
            class="cover-area"
            aria-label="Album cover">

            <img
                class="album-cover"
                src="assets/images/cover.jpeg"
                alt="Io album cover">

        </section>



        <!-- =================================================
             RIGHT COLUMN — META
        ================================================== -->

        <section class="meta-area">


            <!-- =============================================
                 LANGUAGE
            ============================================== -->

            <div class="language-switch">

                <button
                    class="lang-btn active"
                    data-lang="en">

                    EN

                </button>

                <span>/</span>

                <button
                    class="lang-btn"
                    data-lang="ru">

                    RU

                </button>

            </div>



            <!-- =============================================
                 ALBUM
            ============================================== -->

            <div class="title-row">

                <h1 class="album-title">

                    Io

                </h1>

                <span class="meta-label">

                    Album

                </span>

            </div>



            <!-- =============================================
                 ARTIST
            ============================================== -->

            <div class="artist-row">

                <h2 class="artist-name">

                    Lo.Krain

                </h2>

                <span class="meta-label">

                    Artist

                </span>

            </div>



            <!-- =============================================
                 RELEASE
            ============================================== -->

            <div class="release-row">

                <span class="release-label">

                    Release

                </span>

                <span class="release-date">

                    June 21, 2026

                </span>

            </div>



            <!-- =============================================
                 DESCRIPTION
            ============================================== -->

            <p
                class="album-description"
                data-i18n="albumDescription">

                An album completing a fifteen-year journey
                from night to dawn.
                Listen from beginning to end.
                The path continues after the final track.

            </p>



            <!-- =============================================
                 ARTIST PHOTO
            ============================================== -->

            <div class="artist-card">

                <img
                    src="assets/images/artist.jpg"
                    alt="Lo.Krain"
                    class="artist-photo">

            </div>



            <!-- =============================================
                 PLAYER
            ============================================== -->

            <section
                class="player-panel"
                id="playerPanel">


                <!-- =========================================
                     PLAYER CONTROLS
                ========================================== -->

                <div class="player-controls">

                    <button
                        id="playButton"
                        class="control-link">

                        Play

                    </button>


                    <button
                        id="pauseButton"
                        class="control-link">

                        Pause

                    </button>


                    <button
                        id="skipButton"
                        class="control-link">

                        Skip

                    </button>

                </div>



                <!-- =========================================
                     TIME
                ========================================== -->

                <div class="player-time">

                    <span id="currentTime">

                        00:00

                    </span>

                    <span class="time-separator">

                        /

                    </span>

                    <span id="duration">

                        00:00

                    </span>

                </div>



                <!-- =========================================
                     PROGRESS
                ========================================== -->

                <div
                    class="progress-track"
                    id="progressTrack">

                    <div
                        class="progress-fill"
                        id="progressFill">
                    </div>

                </div>



                <!-- =========================================
                     PLAYLIST
                ========================================== -->

                <section
                    class="playlist-section"
                    aria-label="Playlist">

                    <ol
                        class="playlist"
                        id="playlist">

                        <!--
                            player.js populates this list
                        -->

                    </ol>

                </section>

            </section>



            <!-- =============================================
                 HIDDEN CONTENT
                 
                 These remain in the DOM.
                 They can be unlocked after Myth.
            ============================================== -->


            <!-- ABOUT -->

            <section
                class="hidden-section"
                id="aboutSection">

                <h3>

                    About

                </h3>

            </section>



            <!-- LYRICS -->

            <section
                class="hidden-section"
                id="lyricsSection">

                <h3>

                    Lyrics

                </h3>

            </section>



            <!-- COMMUNICATION -->

            <section
                class="hidden-section"
                id="communicationSection">

                <h3>

                    Communication

                </h3>


                <form
                    class="communication-form"
                    id="communicationForm">


                    <input
                        type="text"
                        id="senderName"
                        name="senderName"
                        placeholder="Name"
                        autocomplete="name">


                    <input
                        type="email"
                        id="senderEmail"
                        name="senderEmail"
                        placeholder="Email"
                        autocomplete="email">


                    <textarea
                        id="message"
                        name="message"
                        placeholder="Message">
                    </textarea>


                    <button
                        type="submit">

                        Send

                    </button>


                </form>

            </section>


        </section>

    </main>

</div>



<!-- =========================================================
     MYTH PLACEHOLDER

     NOT ACTIVE YET.

     This is intentionally outside .world and .edition.
     The new Myth will become an independent scene.
========================================================= -->

<section
    id="mythLayer"
    class="myth-layer hidden"
    aria-hidden="true">

    <div
        id="mythViewport"
        class="myth-viewport">

        <!--
            New SVG Myth will be inserted here.
        -->

    </div>


    <aside
        id="mythPanel"
        class="myth-panel">

    </aside>


    <button
        id="returnToDawn"
        class="return-to-dawn">

        Return to Dawn

    </button>

</section>



<!-- =========================================================
     AUDIO
========================================================= -->

<audio
    id="player"
    preload="metadata">
</audio>


<audio
    id="windSound"
    preload="auto"
    src="assets/sounds/wind-lokrain.mp3">
</audio>


<audio
    id="mythSound"
    preload="auto"
    src="assets/sounds/lokrainmyth.mp3">
</audio>



<!-- =========================================================
     EMAILJS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>



<!-- =========================================================
     CORE JS
========================================================= -->

<script src="js/storage.js"></script>

<script src="js/translations.js"></script>

<script src="js/world.js"></script>

<script src="js/player.js"></script>

<script src="js/living.js"></script>



<!-- =========================================================
     FUTURE MYTH ENGINE
     
     Temporarily disabled while the new Myth is rebuilt.
========================================================= -->

<!--
<script src="js/myth.js"></script>
-->



</body>

</html>
