<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lo.Krain — Io</title>

<meta
    name="description"
    content="Io — the album by Lo.Krain.">

<meta
    name="theme-color"
    content="#0e0d0c">

<!-- =======================================================
     FONTS
======================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Modak&display=swap"
    rel="stylesheet">


<!-- =======================================================
     ICONS
======================================================= -->

<link
    rel="icon"
    href="assets/icons/favicon.ico">

<link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="assets/icons/favicon-32x32.png">

<link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="assets/icons/favicon-16x16.png">

<link
    rel="apple-touch-icon"
    href="assets/icons/apple-touch-icon.png">

<link
    rel="manifest"
    href="assets/icons/site.webmanifest">


<!-- =======================================================
     OPEN GRAPH
======================================================= -->

<meta
    property="og:title"
    content="Lo.Krain — Io">

<meta
    property="og:type"
    content="website">

<meta
    property="og:image"
    content="assets/icons/social-cover.jpg">


<!-- =======================================================
     CSS
======================================================= -->

<link
    rel="stylesheet"
    href="css/theme.css">

<link
    rel="stylesheet"
    href="css/animations.css">

<link
    rel="stylesheet"
    href="css/main.css">

<link
    rel="stylesheet"
    href="css/responsive.css">

<link 
    rel="stylesheet" 
    href="css/panels.css">

</head>

<body>

<!-- ==========================================================
     INTRO
========================================================== -->

<div
    class="intro"
    id="intro">

<div class="intro-content">

    <h1 class="intro-logo">
        Lo.Krain — Io
    </h1>

    <p class="intro-action">
        Journey to the Dawn
    </p>

</div>

</div>

<!-- ==========================================================
     WORLD
========================================================== -->

<div
    class="world"
    id="world">

<!-- Atmospheric background -->

<div class="background-layer"></div>

<div class="grain-layer"></div>

<div class="light-layer"></div>


<!-- =======================================================
     GHOST WORDS
     Оставляем как атмосферный слой.
     Их внешний вид регулируется CSS.
======================================================= -->

<div
    class="ghost-words"
    aria-hidden="true">

    <span>PATH</span>

    <span>NIGHT</span>

    <span>IO</span>

    <span>DAWN</span>

    <span>HOME</span>

</div>


<!-- =======================================================
     EDITION / PLAYER
======================================================= -->

<main class="edition">


    <!-- ===================================================
         COVER
    =================================================== -->

    <section class="cover-area">

    <img
        class="album-cover"
        src="assets/images/cover.jpeg"
        alt="Io album cover">

        <!-- ===================================================
         POST-MYTH NAVIGATION
    ==================================================== -->

    <nav class="myth-navigation hidden" id="mythNavigation">

        <button 
    type="button"
    data-panel="about">
    About
</button>

        <button 
    type="button"
    data-panel="lyrics">
    Lyrics
</button>

        <button 
    type="button" 
    id="mythInfoButton">
    Lo.Krain Myth
</button>

        <button 
    type="button"
    data-panel="communication">
    Communication
</button>
            
       <button 
    type="button"
    data-panel="creator">
    Creator
</button>

    </nav>

</section>

    <!-- ===================================================
         META
    =================================================== -->

    <section class="meta-area">


        <!-- ===============================================
             LANGUAGE
        ================================================ -->

        <div class="language-switch">

            <button
                class="lang-btn active"
                data-lang="en">

                EN

            </button>

            <span>/</span>

            <button
                class="lang-btn"
                data-lang="ru">

                RU

            </button>

        </div>


        <!-- ===============================================
             ALBUM
        ================================================ -->

        <div class="title-row">

            <h1 class="album-title">
                Io
            </h1>

            <span class="meta-label">
                Album
            </span>

        </div>


        <!-- ===============================================
             ARTIST
        ================================================ -->

        <div class="artist-row">

            <h2 class="artist-name">
                Lo.Krain
            </h2>

            <span class="meta-label">
                Artist
            </span>

        </div>


        <!-- ===============================================
             RELEASE
        ================================================ -->

        <div class="release-row">

            <span class="release-label">
                Release
            </span>

            <span class="release-date">
                June 21, 2026
            </span>

        </div>


        <!-- ===============================================
             DESCRIPTION
        ================================================ -->

        <p
            class="album-description"
            data-i18n="albumDescription">

            An album completing a fifteen-year journey from night to dawn.
            Listen from beginning to end.
            The path continues after the final track.

        </p>


        <!-- ===============================================
             ARTIST PHOTO
        ================================================ -->

        <div class="artist-card">

            <img
                src="assets/images/artist.jpg"
                alt="Lo.Krain"
                class="artist-photo">

        </div>


        <!-- ===============================================
             PLAYER
        ================================================ -->

        <section class="player-panel">

            <!-- PLAYER CONTROLS -->

            <div class="player-controls">

                <button
                    id="playButton"
                    class="control-link">

                    Play

                </button>

                <button
                    id="pauseButton"
                    class="control-link">

                    Pause

                </button>

                <button
                    id="skipButton"
                    class="control-link">

                    Skip

                </button>

            </div>


            <!-- TIME -->

            <div class="player-time">

                <span id="currentTime">
                    00:00
                </span>

                <span class="time-separator">
                    /
                </span>

                <span id="duration">
                    00:00
                </span>

            </div>


            <!-- PROGRESS -->

            <div
    class="progress-track"
    id="progressBar">

    <div
        class="progress-fill"
        id="progressFill">
    </div>

</div>


            <!-- PLAYLIST -->

            <section class="playlist-section">

                <ol
                    class="playlist"
                    id="playlist">

                    <!-- Filled by player.js -->

                </ol>

            </section>

        </section>

        <!-- ===============================================
             ABOUT
        ================================================ -->

        <section
            class="hidden-section"
            id="aboutSection">

            <h3>
                About
            </h3>

        </section>


        <!-- ===============================================
             LYRICS
        ================================================ -->

        <section
            class="hidden-section"
            id="lyricsSection">

            <h3>
                Lyrics
            </h3>

        </section>

            </section>

</main>

</div>

<!-- ==========================================================
     GO DEEPER / TRANSITION SCREEN
========================================================== -->

<div
    class="outro hidden"
    id="outro">

    <div class="outro-content">

        <button
            id="outroGoDeeper"
            class="outro-button">

            Go Deeper?

        </button>

    </div>

</div>

<!-- ==========================================================
     MYTH SCREEN
     
     Пока пустой контейнер.
     Сюда позже поставим новый SVG-миф.
========================================================== -->

<section
    id="mythScreen"
    class="myth-screen hidden"
    aria-hidden="true">

<div
    id="mythViewport"
    class="myth-viewport">

    <!-- New SVG Myth Map will be inserted here -->

</div>

</section>

<!-- ==========================================================
     AUDIO
========================================================== -->

<audio
 id="player"
 preload="metadata">
</audio>

<audio
 id="mythSound"
 preload="auto"
 src="assets/sounds/lokrainmyth.mp3">
</audio>

<!-- ==========================================================
     CORE
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script src="js/storage.js"></script>

<script src="js/translations.js"></script>

<script src="js/player.js"></script>

<script src="js/living.js"></script>

<script src="js/world.js"></script>

<script src="js/myth.js"></script>

<script src="js/panels.js"></script>

<script src="js/communication.js"></script>

    <!-- ==========================================================
     GLOBAL INFORMATION PANEL
========================================================== -->

<section
    id="globalPanel"
    class="global-panel"
    aria-hidden="true">

    <button
        id="globalPanelClose"
        class="global-panel-close"
        aria-label="Close">

        ×

    </button>

    <div class="global-panel-inner">

        <div
            id="globalPanelContent"
            class="global-panel-content">
        </div>

    </div>

</section>

</body>

</html>
